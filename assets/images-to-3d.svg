<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="title desc">
  <title id="title">Images to 3D: a conceptual overview</title>
  <desc id="desc">RGB observations enter learned geometric prediction. Outputs can include pointmaps, depth and cameras. The drawing is a schematic, not a reconstruction result.</desc>
  <rect width="720" height="310" rx="18" fill="#10252d"/>
  <text x="28" y="39" fill="#a9c7ce" font-family="sans-serif" font-size="17" letter-spacing="2">IMAGES TO 3D · CONCEPTUAL VIEW</text>
  <g fill="none" stroke="#78a3ad" stroke-width="2">
    <rect x="28" y="65" width="190" height="170" rx="12"/>
    <rect x="264" y="65" width="192" height="170" rx="12"/>
    <rect x="502" y="65" width="190" height="170" rx="12"/>
    <path d="M224 150H250M462 150H488"/>
  </g>
  <path d="M249 145L257 150L249 155ZM487 145L495 150L487 155Z" fill="#78a3ad"/>
  <text x="123" y="193" fill="#edf4ef" font-family="sans-serif" font-size="23" font-weight="600" text-anchor="middle">RGB images</text>
  <text x="360" y="183" fill="#edf4ef" font-family="sans-serif" font-size="23" font-weight="600" text-anchor="middle">Learned</text>
  <text x="360" y="211" fill="#edf4ef" font-family="sans-serif" font-size="23" font-weight="600" text-anchor="middle">geometry</text>
  <text x="597" y="193" fill="#edf4ef" font-family="sans-serif" font-size="23" font-weight="600" text-anchor="middle">3D information</text>
  <g stroke="#d0e5c5" stroke-width="2" fill="#26434b">
    <rect x="65" y="91" width="75" height="59" rx="3" transform="rotate(-9 100 120)"/>
    <rect x="107" y="98" width="75" height="59" rx="3" transform="rotate(8 143 127)"/>
    <path d="M114 143L130 125L142 135L156 116L174 148" fill="none"/>
    <rect x="307" y="96" width="106" height="55" rx="8"/>
    <path d="M325 111H395M325 124H395M325 137H395" stroke="#78a3ad"/>
    <path d="M557 137L597 112L642 130L602 155ZM557 137V100L597 76L642 94V130M597 112V76" fill="none"/>
