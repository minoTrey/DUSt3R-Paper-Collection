  <text x="360" y="270" text-anchor="middle" fill="#a9c7ce" font-family="sans-serif" font-size="17">Pointmaps · depth · camera poses · task-specific representations</text>
  <text x="360" y="293" text-anchor="middle" fill="#a9c7ce" font-family="sans-serif" font-size="15">Outputs and post-processing depend on the method.</text>
