name: paper-gallery

on:
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "assets/**",
        "package*.json",
        "data/paper-thumbnails.json",
        "data/paper-card-inventory.json",
        "data/publication-dates.json",
        ".github/workflows/pages.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "docs/**",
        "assets/**",
        "package*.json",
        "data/paper-thumbnails.json",
        "data/paper-card-inventory.json",
        "data/publication-dates.json",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Verify source collection
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          python tools/verify_all.py
          python tools/build_card_inventory.py --check
      - name: Build source-backed static gallery
        run: |
          node --test site/build.test.mjs site/thumbnails.test.mjs site/publication-date-utils.test.mjs site/publication-dates.test.mjs
          node site/build.mjs --base /DUSt3R-Paper-Collection/
          node site/check.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved gallery
        id: deployment
        uses: actions/deploy-pages@v4
